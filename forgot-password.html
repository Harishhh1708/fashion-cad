<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><script>try{var t=localStorage.getItem("fc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><title>Reset password · FashionCAD Studio</title></head><body>
<div class="wrap"><header class="nav"><a class="logo" href="index.html">Fashion<i>CAD</i></a></header>
<main class="card"><h1>Reset password</h1><p class="sub">Enter your email and we'll send a reset link if an account exists.</p>
<form id="f" novalidate><label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<div id="msg" class="msg" hidden role="status"></div>
<button class="btn" id="go" type="submit">Send reset link</button></form>
<div class="links"><a href="login.html">Back to log in</a><a href="signup.html">Create account</a></div></main></div>
<script type="module">
import {configured,resetPassword,showMsg,busy,setupBanner} from "./js/auth.js";
setupBanner();
const f=document.getElementById("f"),m=document.getElementById("msg"),b=document.getElementById("go");
f.addEventListener("submit",async e=>{e.preventDefault();
 const email=f.email.value.trim();if(!email)return showMsg(m,"Enter your email.");
 if(!configured)return showMsg(m,"Firebase isn't connected yet. See the README.");
 busy(b,true,"Sending…");
 try{await resetPassword(email)}catch(err){if(err&&(err.code==="auth/invalid-email"||err.code==="auth/network-request-failed")){busy(b,false);return showMsg(m,err.code==="auth/invalid-email"?"Enter a valid email address.":"Network problem. Try again.")}}
 showMsg(m,"If an account exists for that email, a reset link is on its way. Check spam too. You can send it again in a minute.","ok");
 setTimeout(()=>busy(b,false),60000);b.textContent="Send again in 60 seconds";});
</script></body></html>
